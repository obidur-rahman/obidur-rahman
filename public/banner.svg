<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" fill="#0a0a0a"/>

  <!-- background texture — dense scatter -->
  <g fill="#141414">
    <circle cx="45" cy="30" r="1"/><circle cx="132" cy="18" r="0.8"/><circle cx="210" cy="42" r="1.2"/>
    <circle cx="305" cy="25" r="0.7"/><circle cx="390" cy="55" r="1"/><circle cx="478" cy="15" r="0.9"/>
    <circle cx="555" cy="38" r="1.1"/><circle cx="640" cy="22" r="0.6"/><circle cx="720" cy="48" r="1"/>
    <circle cx="780" cy="30" r="0.8"/><circle cx="85" cy="65" r="1"/><circle cx="175" cy="80" r="0.7"/>
    <circle cx="265" cy="58" r="1.3"/><circle cx="350" cy="72" r="0.9"/><circle cx="440" cy="50" r="1"/>
    <circle cx="530" cy="68" r="0.8"/><circle cx="615" cy="45" r="1.1"/><circle cx="700" cy="75" r="0.7"/>
    <circle cx="30" cy="120" r="0.9"/><circle cx="120" cy="140" r="1.2"/><circle cx="200" cy="110" r="0.8"/>
    <circle cx="290" cy="135" r="1"/><circle cx="380" cy="105" r="0.7"/><circle cx="465" cy="125" r="1.1"/>
    <circle cx="550" cy="95" r="0.9"/><circle cx="635" cy="118" r="1"/><circle cx="715" cy="88" r="0.6"/>
    <circle cx="50" cy="170" r="0.7"/><circle cx="140" cy="195" r="1"/><circle cx="225" cy="165" r="0.8"/>
    <circle cx="315" cy="185" r="1.2"/><circle cx="400" cy="155" r="0.9"/><circle cx="490" cy="178" r="0.7"/>
    <circle cx="575" cy="150" r="1"/><circle cx="660" cy="172" r="0.8"/><circle cx="745" cy="140" r="1.1"/>
    <circle cx="35" cy="230" r="1"/><circle cx="125" cy="255" r="0.8"/><circle cx="215" cy="220" r="1.1"/>
    <circle cx="300" cy="248" r="0.7"/><circle cx="385" cy="215" r="1"/><circle cx="475" cy="240" r="0.9"/>
    <circle cx="560" cy="208" r="1.2"/><circle cx="645" cy="235" r="0.8"/><circle cx="730" cy="200" r="0.7"/>
    <circle cx="60" cy="290" r="0.8"/><circle cx="150" cy="310" r="1"/><circle cx="240" cy="280" r="0.9"/>
    <circle cx="330" cy="305" r="1.1"/><circle cx="415" cy="275" r="0.7"/><circle cx="505" cy="298" r="1"/>
    <circle cx="590" cy="268" r="0.8"/><circle cx="680" cy="292" r="1.2"/><circle cx="760" cy="260" r="0.6"/>
    <circle cx="40" cy="345" r="0.9"/><circle cx="130" cy="365" r="0.7"/><circle cx="220" cy="335" r="1"/>
    <circle cx="310" cy="358" r="0.8"/><circle cx="400" cy="330" r="1.1"/><circle cx="490" cy="352" r="0.7"/>
    <circle cx="575" cy="325" r="0.9"/><circle cx="665" cy="348" r="1"/><circle cx="750" cy="318" r="0.8"/>
  </g>

  <!-- tilted grid — gives depth -->
  <g stroke="#151515" stroke-width="0.4" transform="rotate(-8, 400, 200)">
    <line x1="0" y1="0" x2="0" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="0" y1="0" x2="800" y2="0"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- flowing data streams — organic curves -->
  <g stroke="#1a1a1a" stroke-width="0.6" fill="none">
    <path d="M -20 320 C 100 280 180 350 300 300 S 500 200 620 240 S 750 180 820 160"/>
    <path d="M -20 340 C 120 300 200 370 340 310 S 520 220 650 260 S 770 200 830 180"/>
    <path d="M -20 280 C 80 240 160 310 280 260 S 480 170 600 210 S 730 150 810 130"/>
  </g>

  <!-- the confident curve — a model's prediction -->
  <path d="M 40 260 C 120 250 180 230 260 215 C 340 200 420 180 500 160 C 580 140 660 115 760 90" 
        stroke="#444" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- the truth — a faint red guide -->
  <path d="M 40 270 L 760 80" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3 10" opacity="0.35"/>

  <!-- noise around the curve — where the model is wrong -->
  <g fill="#1e1e1e">
    <circle cx="120" cy="248" r="3"/><circle cx="180" cy="228" r="2.5"/>
    <circle cx="260" cy="210" r="3.5"/><circle cx="340" cy="195" r="2.8"/>
    <circle cx="420" cy="175" r="3.2"/><circle cx="500" cy="155" r="2.5"/>
    <circle cx="580" cy="135" r="3"/><circle cx="660" cy="112" r="2.8"/>
    <circle cx="140" cy="258" r="2"/><circle cx="220" cy="240" r="2.2"/>
    <circle cx="300" cy="222" r="1.8"/><circle cx="380" cy="205" r="2.5"/>
    <circle cx="460" cy="188" r="2"/><circle cx="540" cy="168" r="2.3"/>
    <circle cx="620" cy="148" r="1.8"/><circle cx="700" cy="128" r="2.2"/>
  </g>

  <!-- the lie — red points where model deviates from truth -->
  <g fill="#c0392b">
    <circle cx="180" cy="232" r="3.5"/>
    <circle cx="340" cy="198" r="4"/>
    <circle cx="500" cy="158" r="3.2"/>
    <circle cx="620" cy="128" r="4.5"/>
    <circle cx="700" cy="105" r="3"/>
  </g>

  <!-- red cross marks at deviation points -->
  <g stroke="#c0392b" stroke-width="1" opacity="0.7">
    <line x1="175" y1="227" x2="185" y2="237"/><line x1="185" y1="227" x2="175" y2="237"/>
    <line x1="335" y1="193" x2="345" y2="203"/><line x1="345" y1="193" x2="335" y2="203"/>
    <line x1="495" y1="153" x2="505" y2="163"/><line x1="505" y1="153" x2="495" y2="163"/>
    <line x1="615" y1="123" x2="625" y2="133"/><line x1="625" y1="123" x2="615" y2="133"/>
    <line x1="695" y1="100" x2="705" y2="110"/><line x1="705" y1="100" x2="695" y2="110"/>
  </g>

  <!-- radiating circles — like ripples from a lie -->
  <g stroke="#c0392b" stroke-width="0.4" fill="none" opacity="0.2">
    <circle cx="340" cy="198" r="15"/><circle cx="340" cy="198" r="30"/>
    <circle cx="340" cy="198" r="50"/>
    <circle cx="620" cy="128" r="18"/><circle cx="620" cy="128" r="35"/>
    <circle cx="620" cy="128" r="55"/>
  </g>

  <!-- geometric fragments — broken data -->
  <g stroke="#222" stroke-width="0.6" fill="none">
    <rect x="100" y="100" width="18" height="18" transform="rotate(12, 109, 109)"/>
    <rect x="440" y="60" width="14" height="14" transform="rotate(-8, 447, 67)"/>
    <rect x="680" y="160" width="20" height="20" transform="rotate(22, 690, 170)"/>
    <polygon points="250,310 260,290 270,310" stroke-width="0.5"/>
    <polygon points="560,280 575,260 590,280" stroke-width="0.5"/>
    <polygon points="720,240 730,222 740,240" stroke-width="0.5"/>
  </g>

  <!-- barcode-like mark in the corner -->
  <g fill="#1c1c1c">
    <rect x="620" y="355" width="1.5" height="20"/><rect x="624" y="355" width="3" height="20"/>
    <rect x="629" y="355" width="1" height="20"/><rect x="632" y="355" width="2" height="20"/>
    <rect x="636" y="355" width="1.5" height="20"/><rect x="640" y="355" width="3.5" height="20"/>
    <rect x="646" y="355" width="1" height="20"/><rect x="649" y="355" width="2" height="20"/>
    <rect x="653" y="355" width="1.5" height="20"/><rect x="657" y="355" width="2.5" height="20"/>
    <rect x="662" y="355" width="1" height="20"/><rect x="665" y="355" width="3" height="20"/>
    <rect x="670" y="355" width="1.5" height="20"/><rect x="674" y="355" width="2" height="20"/>
  </g>

  <!-- corner marks — editorial red -->
  <g stroke="#c0392b" stroke-width="1.5">
    <line x1="40" y1="25" x2="40" y2="50"/><line x1="40" y1="25" x2="65" y2="25"/>
    <line x1="760" y1="350" x2="760" y2="375"/><line x1="760" y1="375" x2="785" y2="375"/>
  </g>

  <!-- a single thin red line — the axis -->
  <line x1="55" y1="55" x2="55" y2="365" stroke="#c0392b" stroke-width="0.5" opacity="0.3"/>
</svg>
